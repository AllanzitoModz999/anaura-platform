<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - ANAURA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="painel.css">
</head>
<body>
    <div class="painel-container">
        <header class="painel-header">
            <div class="header-content">
                <h1>Painel Administrativo ANAURA</h1>
                <button id="sairBtn" class="btn btn-logout">Sair</button>
            </div>
        </header>
        
        <main class="painel-main">
            <div class="panel-controls">
                <h2>Denúncias em Análise</h2>
                <div class="filter-container">
                    <input type="text" id="filtroNome" placeholder="Filtrar por nome..." class="filtro">
                    <select id="filtroStatus" class="filtro">
                        <option value="">Todos os status</option>
                        <option value="Em análise">Em análise</option>
                        <option value="Investigando">Investigando</option>
                        <option value="Resolvido">Resolvido</option>
                        <option value="Arquivado">Arquivado</option>
                    </select>
                </div>
            </div>
            
            <div id="denunciasContainer" class="denuncias-container">
                <!-- Denúncias serão carregadas aqui -->
            </div>
            
            <div id="emptyState" class="empty-state">
                <p>📋 Nenhuma denúncia registrada ainda</p>
            </div>
        </main>
    </div>
    
    <!-- Modal para detalhes e ações -->
    <div id="actionModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            
            <div id="modalBody" class="modal-body">
                <!-- Conteúdo será preenchido dinamicamente -->
            </div>
            
            <div class="modal-actions">
                <button id="btnInvestigar" class="btn-action btn-investigar">Investigar</button>
                <button id="btnPunir" class="btn-action btn-punir">Punir</button>
                <button id="btnArquivar" class="btn-action btn-arquivar">Arquivar</button>
            </div>
        </div>
    </div>
    
    <script src="painel.js"></script>
</body>
</html>
